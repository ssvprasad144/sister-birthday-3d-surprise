<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7fb"/><stop offset=".45" stop-color="#f7e9f8"/><stop offset="1" stop-color="#e6efff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9fca"/><stop offset="1" stop-color="#d85b9f"/></linearGradient>
 <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7b9ff"/><stop offset="1" stop-color="#8e82dc"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<circle cx="800" cy="430" r="430" fill="url(#glow)" opacity=".8"/>
<g opacity=".35" filter="url(#blur)">
 <circle cx="190" cy="220" r="130" fill="#ff9fc8"/><circle cx="1400" cy="180" r="160" fill="#b7acff"/>
 <circle cx="1280" cy="830" r="190" fill="#a9dcff"/><circle cx="300" cy="820" r="170" fill="#ffd2e5"/>
</g>
<!-- translucent giant heart -->
<path d="M800 790 C650 650 390 500 390 310 C390 190 540 145 630 250 L800 420 L970 250 C1060 145 1210 190 1210 310 C1210 500 950 650 800 790Z" fill="none" stroke="#ef8fbc" stroke-width="5" opacity=".16"/>
<path d="M800 720 C680 605 475 475 475 330 C475 250 570 220 635 292 L800 470 L965 292 C1030 220 1125 250 1125 330 C1125 475 920 605 800 720Z" fill="#fff" opacity=".18"/>
<!-- balloons -->
<g opacity=".9">
 <ellipse cx="145" cy="320" rx="78" ry="100" fill="url(#pink)"/><path d="M145 420 Q160 500 125 570" fill="none" stroke="#c878a0" stroke-width="2"/>
 <ellipse cx="1470" cy="350" rx="82" ry="108" fill="url(#lav)"/><path d="M1470 458 Q1450 520 1490 610" fill="none" stroke="#9c91c7" stroke-width="2"/>
 <ellipse cx="300" cy="730" rx="58" ry="75" fill="#ffd3a9"/><path d="M300 805 Q325 850 305 900" fill="none" stroke="#c8a68a" stroke-width="2"/>
 <ellipse cx="1320" cy="730" rx="62" ry="80" fill="#f5b6da"/><path d="M1320 810 Q1300 865 1330 915" fill="none" stroke="#c893b2" stroke-width="2"/>
</g>
<!-- ribbon -->
<path d="M0 170 C350 70 470 250 700 145 S1120 20 1600 170" fill="none" stroke="#fff" stroke-width="30" opacity=".28"/>
<path d="M0 175 C350 75 470 255 700 150 S1120 25 1600 175" fill="none" stroke="#ed8db9" stroke-width="3" opacity=".28"/>
<!-- bokeh -->
<g fill="#fff">
 <circle cx="250" cy="130" r="6"/><circle cx="390" cy="170" r="4"/><circle cx="1180" cy="120" r="6"/><circle cx="1380" cy="250" r="5"/>
 <circle cx="110" cy="650" r="5"/><circle cx="1490" cy="650" r="7"/><circle cx="510" cy="870" r="5"/><circle cx="1090" cy="860" r="6"/>
</g>
<g fill="#e96da9" opacity=".65">
 <circle cx="220" cy="560" r="5"/><circle cx="1370" cy="560" r="5"/><circle cx="440" cy="720" r="4"/><circle cx="1160" cy="700" r="4"/>
</g>
<!-- confetti -->
<g opacity=".55" stroke-linecap="round" stroke-width="5">
 <path d="M70 110l20 18M1520 110l-18 22M90 880l18-15M1510 875l-20-18M520 70l10 22M1090 60l-12 22" stroke="#dc70a8"/>
 <path d="M170 520l15-8M1430 520l-15-8M610 900l8-20M1010 910l-8-20" stroke="#9388df"/>
</g>
<!-- subtle ground glow -->
<ellipse cx="800" cy="930" rx="600" ry="80" fill="#fff" opacity=".55" filter="url(#soft)"/>
</svg>